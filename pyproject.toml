[project]
name = "idiolect"
version = "0.1.0"
description = "A technical LLM that learns knowledge and a person's natural writing style from their content."
readme = "README.md"
authors = [
    { name = "EssamShenhab", email = "essam119999@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymongo>=4.18.2",
    "qdrant-client>=1.19.1",
    "pyyaml>=6.0.3",
    "zenml[local,server]>=0.97.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "idiolect"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]